name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  prototype:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: droid-assist/droid-assist-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: droid-assist/droid-assist-prototype/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run